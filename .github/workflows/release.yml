name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The whole CI file, matrix and gates included. A version on PyPI cannot be
  # re-uploaded, so the tag builds only what already passed.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: the job mints a short-lived OIDC token that PyPI
      # exchanges for an upload token. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # v1.2.3 building bazaar_ti-0.1.0 would publish under a version nobody
      # asked for, and that number is then spent for good.
      - name: Tag matches the built version
        run: |
          python - <<'EOF'
          import os, sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          built = sorted(p.name for p in Path("dist").glob(f"*-{tag}-*.whl"))
          if not built:
              sys.exit(f"tag {tag} matches no wheel in {[p.name for p in Path('dist').iterdir()]}")
          print(f"tag {tag} -> {built}")
          EOF

      - uses: pypa/gh-action-pypi-publish@release/v1
